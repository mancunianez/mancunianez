<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Vitalii Kulish — full-stack developer" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#150a33"/>
      <stop offset="1" stop-color="#33104f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="0.45" stop-color="#ff2975"/>
      <stop offset="1" stop-color="#8c1eff"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b026ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b026ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <mask id="sunCut">
      <rect x="0" y="0" width="1200" height="320" fill="#000"/>
      <circle cx="600" cy="146" r="82" fill="#fff"/>
      <rect x="500" y="168" width="200" height="5" fill="#000"/>
      <rect x="500" y="184" width="200" height="7" fill="#000"/>
      <rect x="500" y="200" width="200" height="9" fill="#000"/>
      <rect x="500" y="216" width="200" height="12" fill="#000"/>
    </mask>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#9ff3ff">
    <circle cx="90" cy="50" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="120" r="1.1"><animate attributeName="opacity" values="1;0.1;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="92" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="58" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="150" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="180" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="205" r="1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="52" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="112" r="1"><animate attributeName="opacity" values="1;0.15;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="44" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="94" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="132" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="4.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="180" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="170" r="1.2"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- synthwave sun -->
  <rect width="1200" height="320" fill="url(#sun)" mask="url(#sunCut)" filter="url(#bigGlow)" opacity="0.55"/>
  <rect width="1200" height="320" fill="url(#sun)" mask="url(#sunCut)"/>

  <!-- neon grid -->
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#00e5ff" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <g stroke="url(#gridfade)" stroke-width="1.5">
    <line x1="0" y1="244" x2="1200" y2="244"/>
    <line x1="0" y1="261" x2="1200" y2="261"/>
    <line x1="0" y1="283" x2="1200" y2="283"/>
    <line x1="0" y1="311" x2="1200" y2="311"/>
  </g>
  <g stroke="#b026ff" stroke-width="1.2" opacity="0.45">
    <line x1="600" y1="230" x2="600" y2="320"/>
    <line x1="600" y1="230" x2="540" y2="320"/>
    <line x1="600" y1="230" x2="660" y2="320"/>
    <line x1="600" y1="230" x2="480" y2="320"/>
    <line x1="600" y1="230" x2="720" y2="320"/>
    <line x1="600" y1="230" x2="400" y2="320"/>
    <line x1="600" y1="230" x2="800" y2="320"/>
    <line x1="600" y1="230" x2="300" y2="320"/>
    <line x1="600" y1="230" x2="900" y2="320"/>
    <line x1="600" y1="230" x2="180" y2="320"/>
    <line x1="600" y1="230" x2="1020" y2="320"/>
    <line x1="600" y1="230" x2="40" y2="320"/>
    <line x1="600" y1="230" x2="1160" y2="320"/>
  </g>

  <!-- name: pulsing neon -->
  <text x="600" y="186" text-anchor="middle" font-size="56" font-weight="700" fill="#00e5ff" filter="url(#bigGlow)" letter-spacing="2">VITALII KULISH<animate attributeName="opacity" values="0.45;0.85;0.45" dur="3s" repeatCount="indefinite"/></text>
  <text x="600" y="186" text-anchor="middle" font-size="56" font-weight="700" fill="#eaf9ff" filter="url(#glow)" letter-spacing="2">VITALII KULISH</text>

  <text x="600" y="221" text-anchor="middle" font-size="16" font-weight="600" fill="#ff3df5" filter="url(#glow)" letter-spacing="9">FULL-STACK DEVELOPER</text>

  <text x="600" y="270" text-anchor="middle" font-size="15" fill="#00e5ff" opacity="0.95" filter="url(#glow)">&gt; dev.level = "pro" &amp;&amp; padel.level = "amateur"</text>

  <!-- terminal chrome corners -->
  <text x="24" y="34" font-size="12" fill="#00e5ff" opacity="0.8">[ OK ] KYIV · UA — 50.45°N 30.52°E</text>
  <text x="1176" y="34" text-anchor="end" font-size="12" fill="#ff3df5" opacity="0.8">uptime ∞</text>

  <!-- CRT scanline sweep -->
  <rect x="0" y="-4" width="1200" height="3" fill="#00e5ff" opacity="0.12"><animate attributeName="y" values="-4;320" dur="7s" repeatCount="indefinite"/></rect>
</svg>
